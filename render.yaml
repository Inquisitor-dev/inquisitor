services:
  - type: web
    name: the-inquisitor-backend
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    healthCheckPath: /
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_MODELS
        sync: false
      # Vercel adresi (ör. https://the-inquisitor.vercel.app); Stripe dönüş adresi için
      - key: FRONTEND_URL
        sync: false
      # Test ortamı: Render ücretsiz planı SMTP'yi engellerse doğrulama kodu mesajda gösterilir.
      # Gerçek yayında kapalı olmalı.
      - key: ALLOW_TEST_MODE
        value: "true"
