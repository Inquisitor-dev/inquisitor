  <path d="M42 54 C42 42 50 34 60 34 C70 34 78 42 78 54 C78 64 70 70 60 70 C50 70 42 64 42 54 Z" fill="#050507"/>
  
  <!-- Yüzdeki Işık / Kararlı Bakış Hatları -->
