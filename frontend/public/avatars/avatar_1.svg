<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d0a0a"/>
      <stop offset="60%" stop-color="#190303"/>
      <stop offset="100%" stop-color="#080101"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c99a3e"/>
      <stop offset="100%" stop-color="#7a5518"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8a0303" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Dış çerçeve ve zemin -->
  <circle cx="60" cy="60" r="56" fill="url(#bg1)" stroke="url(#gold1)" stroke-width="3"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#521b1b" stroke-width="1.2" stroke-dasharray="3 2"/>

